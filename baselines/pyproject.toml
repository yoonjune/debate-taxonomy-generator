[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moderator-bench"
version = "0.1.0"
description = "Full-duplex moderator baseline replay and evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
moderator-bench = "moderator_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
